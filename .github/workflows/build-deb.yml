name: Build DEB Package for Astra Linux

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:buster

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Debian archive repositories
        run: |
          # Полностью перезаписываем sources.list на архивные репозитории
          cat > /etc/apt/sources.list <<'EOF'
          deb http://archive.debian.org/debian/ buster main contrib non-free
          deb http://archive.debian.org/debian-security buster/updates main contrib non-free
          EOF

          # Отключаем проверку срока действия репозитория
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99no-check-valid-until

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential debhelper dpkg-dev cmake pkg-config \
            qtbase5-dev qttools5-dev qttools5-dev-tools libqt5x11extras5-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxext-dev libxfixes-dev libxi-dev libxinerama-dev \
            libv4l-dev libjack-jackd2-dev \
            appstream libappstream-dev

      - name: Remove non-Linux build dependency
        run: |
          sed -i 's/, liboss4-salsa-dev \[!linux-any\]//' debian/control

      - name: Build Debian package
        run: |
          dpkg-buildpackage -us -uc -b -d -Zxz
        env:
          DEB_CMAKE_EXTRA_FLAGS: "-DWITH_PIPEWIRE=FALSE"

      - name: Move DEB files into workspace
        run: |
          mkdir -p deb-output
          cp ../*.deb deb-output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: simplescreenrecorder-deb-astra
          path: deb-output/*.deb
