name: Build DEB Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential debhelper dpkg-dev cmake pkg-config \
            qtbase5-dev qttools5-dev qttools5-dev-tools libqt5x11extras5-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxext-dev libxfixes-dev libxi-dev libxinerama-dev \
            libv4l-dev libjack-jackd2-dev \
            appstream libappstream-dev

      - name: Remove non-Linux build dependency
        run: |
          sed -i 's/, liboss4-salsa-dev \[!linux-any\]//' debian/control
      
      - name: Force xz compression
        run: |
          # Добавляем в debian/rules правило, требующее использовать xz вместо zstd
          echo "" >> debian/rules
          echo "override_dh_builddeb:" >> debian/rules
          echo "	dh_builddeb -- -Zxz" >> debian/rules

      - name: Build Debian package
        run: |
           dpkg-buildpackage -us -uc -b -d -Zxz

      - name: Move DEB files into workspace
        run: |
          mkdir -p deb-output
          cp ../*.deb deb-output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: simplescreenrecorder-deb
          path: deb-output/*.deb